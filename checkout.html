<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | Kopi Java</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8f4ed;
            color: #38271e;
            padding: 25px 15px;
        }

        .navbar {
            max-width: 850px;
            margin: auto;
            padding: 15px 0 25px;
        }

        .logo {
            font-family: Georgia, serif;
            font-size: 27px;
            font-weight: bold;
            color: #593b29;
        }

        .container {
            max-width: 650px;
            margin: 20px auto;
        }

        .heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .heading span {
            font-size: 11px;
            letter-spacing: 2px;
            color: #a07856;
            font-weight: bold;
        }

        .heading h1 {
            font-family: Georgia, serif;
            font-size: 32px;
            margin: 12px 0;
        }

        .heading p {
            color: #88796d;
            font-size: 14px;
        }

        .card {
            background: #fffdf9;
            padding: 25px;
            border-radius: 14px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }

        .card h2 {
            font-family: Georgia, serif;
            font-size: 21px;
            margin-bottom: 20px;
        }

        .product {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 15px;
            background: #f5eee4;
            border-radius: 9px;
        }

        .product p {
            font-size: 13px;
            color: #88796d;
        }

        .product strong {
            color: #593b29;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #e4d8c9;
            border-radius: 7px;
            background: #fff;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #98613b;
        }

        .payment {
            padding: 16px;
            background: #f5eee4;
            border: 1px solid #d9c5ae;
            border-radius: 9px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .payment input {
            width: 18px;
            height: 18px;
            accent-color: #593b29;
        }

        .payment label {
            margin: 0;
        }

        .payment p {
            font-size: 12px;
            font-weight: normal;
            color: #88796d;
            margin-top: 4px;
        }

        .total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #e8ded2;
            padding-top: 18px;
            margin-top: 20px;
        }

        .total strong {
            color: #593b29;
            font-size: 19px;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: #593b29;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            margin-top: 10px;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #805638;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #80634d;
            font-size: 13px;
            text-decoration: none;
        }

        footer {
            text-align: center;
            color: #a08d7b;
            font-size: 12px;
            padding: 30px 0;
        }

        @media(max-width: 480px) {
            .heading h1 {
                font-size: 27px;
            }

            .card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <header class="navbar">
        <a href="index.html" class="logo">
            ☕ Kopi Java
        </a>
    </header>

    <main class="container">

        <div class="heading">
            <span>PREMIUM COFFEE FROM NUSANTARA</span>
            <h1>Checkout Pesanan</h1>
            <p>Isi data pengiriman sebelum menyelesaikan pesanan.</p>
        </div>

        <!-- RINGKASAN PRODUK -->
        <section class="card">

            <h2>Ringkasan Pesanan</h2>

            <div class="product">
                <div>
                    <strong id="produk">Memuat produk...</strong>
                    <p>1 produk pilihan Kopi Java</p>
                </div>

                <strong id="harga">Rp0</strong>
            </div>

            <div class="total">
                <span>Total Pembayaran</span>
                <strong id="total">Rp0</strong>
            </div>

        </section>

        <!-- FORM PENGIRIMAN -->
        <form class="card" onsubmit="konfirmasi(event)">

            <h2>Data Pengiriman</h2>

            <div class="form-group">
                <label for="nama">Nama Penerima</label>
                <input
                    type="text"
                    id="nama"
                    placeholder="Masukkan nama lengkap"
                    required>
            </div>

            <div class="form-group">
                <label for="alamat">Alamat Lengkap</label>
                <input
                    type="text"
                    id="alamat"
                    placeholder="Masukkan alamat lengkap"
                    required>
            </div>

            <div class="form-group">
                <label for="kota">Kota / Kode Pos</label>
                <input
                    type="text"
                    id="kota"
                    placeholder="Masukkan kota dan kode pos"
                    required>
            </div>

            <div class="form-group">
                <label for="hp">Nomor HP</label>
                <input
                    type="tel"
                    id="hp"
                    placeholder="Masukkan nomor HP"
                    required>
            </div>

            <h2>Metode Pembayaran</h2>

            <div class="payment">
                <input
                    type="radio"
                    id="cod"
                    name="payment"
                    value="COD"
                    checked
                    required>

                <label for="cod">
                    Bayar di Tempat (COD)
                    <p>Bayar ketika pesanan diterima.</p>
                </label>
            </div>

            <button type="submit" class="submit-btn">
                Konfirmasi Pesanan →
            </button>

            <a href="index.html" class="back">
                ← Kembali Belanja
            </a>

        </form>

    </main>

    <footer>
        © 2026 Kopi Java. All Rights Reserved.
    </footer>

    <script>

        const namaKopi = localStorage.getItem("namaKopi");
        const hargaKopi = Number(
            localStorage.getItem("hargaKopi") || 0
        );

        document.getElementById("produk").textContent =
            namaKopi || "Belum ada produk dipilih";

        document.getElementById("harga").textContent =
            "Rp" + hargaKopi.toLocaleString("id-ID");

        document.getElementById("total").textContent =
            "Rp" + hargaKopi.toLocaleString("id-ID");

        function konfirmasi(event) {

            event.preventDefault();

            if (!namaKopi || hargaKopi <= 0) {
                alert("Silakan pilih produk terlebih dahulu!");
                window.location.href = "index.html";
                return;
            }

            localStorage.setItem(
                "namaPenerima",
                document.getElementById("nama").value
            );

            localStorage.setItem(
                "alamat",
                document.getElementById("alamat").value
            );

            localStorage.setItem(
                "kota",
                document.getElementById("kota").value
            );

            localStorage.setItem(
                "hp",
                document.getElementById("hp").value
            );

            localStorage.setItem("pembayaran", "COD");

            window.location.href = "success.html";
        }

    </script>

</body>
</html>
